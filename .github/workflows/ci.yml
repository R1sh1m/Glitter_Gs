name: CI Pipeline - Syntax & Autodesk Fusion API Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ci-checks:
    name: CI (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          npm install -g mcp-remote pyright

      - name: Step 1 - Python Syntax Compilation Check
        run: |
          python -c "
          import os, py_compile, sys
          ignore = {'.git', '.venv', 'venv', '__pycache__', 'out', '.agents'}
          errs = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ignore and not d.startswith('.')]
              for f in files:
                  if f.endswith('.py'):
                      p = os.path.join(root, f)
                      try:
                          py_compile.compile(p, doraise=True)
                          print(f'Compiled: {p}')
                      except Exception as e:
                          print(f'SYNTAX ERROR in {p}: {e}', file=sys.stderr)
                          errs += 1
          if errs:
              sys.exit(1)
          "

      - name: Step 2 - Code Quality & Linting Check (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,.venv,venv,out,.agents,FusionMCPSample
          flake8 . --count --exit-zero --max-complexity=20 --max-line-length=140 --statistics --exclude=.git,__pycache__,.venv,venv,out,.agents,FusionMCPSample

      - name: Step 3 - Static Type Checking (pyright)
        run: |
          pyright

      - name: Step 4 - Comprehensive Local CI Pipeline Runner (run_ci.py)
        run: |
          python run_ci.py

      - name: Step 5 - Automated Pytest Discovery & Execution
        run: |
          pytest -v tests/
